[project]
name = "rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.2",
    "httpx>=0.28.1",
    "pdfplumber>=0.11.10",
    "python-docx>=1.2.0",
    "rarfile>=4.5",
    "tiktoken>=0.13.0",
    "google-genai>=1.5.0",
    "pinecone>=5.0.0",
    "python-dotenv>=1.0.0",
    "firebase-admin>=6.4.0",
    "celery>=5.4",
    "redis>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # Only for scripts/liveCeleryCheck.py, which runs its broker on kombu's
    # filesystem transport; that transport locks its spool files through
    # pywin32. No production broker needs it.
    'pywin32>=306; sys_platform == "win32"',
]

[tool.pytest.ini_options]
python_files = ["test*.py"]
markers = [
    "slow: parses the tests/data corpora end to end (~2 minutes). Skip with -m 'not slow'.",
]
